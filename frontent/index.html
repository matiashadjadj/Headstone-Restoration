<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Headstone Restoration FSM</title>
  <link rel="icon" type="image/png" href="logo-icon.png" />
  <link rel="apple-touch-icon" href="logo-icon.png" />
  <meta property="og:image" content="logo-header.png" />
  <link rel="stylesheet" href="styles.css?v=20260414-signature-v2" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script>
    (function() {
      const { protocol, hostname, origin, port } = window.location;
      const isLocalHost = hostname === 'localhost' || hostname === '127.0.0.1' || hostname === '::1';

      if (isLocalHost && port !== '8000') {
        window.__API_BASE__ = 'http://127.0.0.1:8000';
        return;
      }

      if (protocol === 'http:' || protocol === 'https:') {
        window.__API_BASE__ = origin.replace(/\/$/, '');
        return;
      }

      window.__API_BASE__ = '';
    })();
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" data-presets="env,react" src="app.jsx?v=20260414-signature-v2"></script>
</body>
</html>
